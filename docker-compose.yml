version: '3.8'

# ==============================================================================
# Practical 11: Multi-Container Orchestration with Docker Compose
# Student: Daksh Digashia (Roll No: D25CS124) | Course: AWDF
# Services:
#   1. frontend  - React 19 + Vite (port 5173)
#   2. backend   - Node.js + Express + JWT + node-cache (port 5000)
#   3. mongodb   - Official MongoDB 6.0 Database (port 27017)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Service 1: MongoDB Database
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:6.0
    container_name: task-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      # Named volume to persist database records across container restarts
      - mongo-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Service 2: Node.js Express Backend API
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: task-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      # Uses the Compose service name 'mongodb' for DNS resolution across app-network
      - MONGO_URI=mongodb://mongodb:27017/taskmanager
      - JWT_SECRET=jwt_secret_practical7_daksh_d25cs124
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # Service 3: React Frontend (Vite)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - app-network

# ------------------------------------------------------------------------------
# Persistent Volumes (Supplementary Problem Requirement)
# ------------------------------------------------------------------------------
volumes:
  mongo-data:
    name: task-mongo-data
    driver: local

# ------------------------------------------------------------------------------
# Isolated Bridge Network
# ------------------------------------------------------------------------------
networks:
  app-network:
    name: task-app-network
    driver: bridge
